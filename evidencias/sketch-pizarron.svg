<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sketch del Pizarrón de estudio</title>
  <desc id="desc">Boceto de una aplicación para organizar notas adhesivas y convertir unidades, en tonos lavanda, rosa y coral.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e9e1ed" stroke-width="1"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#554365" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1440" height="1000" fill="#f8f4f7"/><rect width="1440" height="1000" fill="url(#grid)" opacity=".55"/>
  <circle cx="1310" cy="85" r="120" fill="#f6d4df" opacity=".55"/><circle cx="90" cy="900" r="145" fill="#e5dcf4" opacity=".65"/>
  <rect x="72" y="42" width="1296" height="916" rx="30" fill="#fffdfd" filter="url(#shadow)"/>
  <path d="M102 42h1236a30 30 0 0 1 30 30v17H72V72a30 30 0 0 1 30-30" fill="#f0e9f6"/>
  <circle cx="103" cy="68" r="7" fill="#e899a9"/><circle cx="127" cy="68" r="7" fill="#e7b78b"/><circle cx="151" cy="68" r="7" fill="#a9c8b3"/>
  <text x="720" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8d8194">mi espacio de estudio · club de estudio</text>
  <text x="120" y="160" font-family="Georgia,serif" font-size="49" font-style="italic" fill="#493b58">Pizarrón de estudio</text>
  <text x="123" y="194" font-family="Arial,sans-serif" font-size="16" fill="#837689">Ideas, apuntes y pequeños cálculos, todo en un mismo lugar.</text>
  <g transform="translate(1170 126)"><rect width="144" height="40" rx="20" fill="#f7e8ee"/><circle cx="22" cy="20" r="6" fill="#d9829a"/><text x="39" y="25" font-family="Arial,sans-serif" font-size="13" fill="#754b65">tu rincón creativo</text></g>
  <!-- note composer -->
  <rect x="112" y="228" width="790" height="260" rx="22" fill="#fff" stroke="#eadfea" stroke-width="1.5"/>
  <text x="140" y="267" font-family="Georgia,serif" font-size="25" fill="#51435e">Una idea para guardar</text>
  <text x="140" y="296" font-family="Arial,sans-serif" font-size="13" fill="#887b8c">Escribí una nota y elegí su colorcito.</text>
  <rect x="140" y="316" width="734" height="84" rx="13" fill="#fcf9fc" stroke="#e8dfe9"/>
  <text x="158" y="346" font-family="Arial,sans-serif" font-size="14" fill="#b2a7b5">¿Qué querés recordar?</text>
  <rect x="140" y="416" width="235" height="44" rx="11" fill="#fff" stroke="#e8dfe9"/>
  <circle cx="160" cy="438" r="6" fill="#d995bc"/><text x="175" y="443" font-family="Arial,sans-serif" font-size="13" fill="#65596b">Categoría: ideas</text><path d="m347 434 6 6 6-6" fill="none" stroke="#887b8c" stroke-width="1.5"/>
  <rect x="699" y="416" width="175" height="44" rx="22" fill="#dd829a"/><text x="786" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#fff">＋ Agregar nota</text>
  <!-- converter -->
  <rect x="926" y="228" width="402" height="260" rx="22" fill="#f2edf8" stroke="#e3d9ed" stroke-width="1.5"/>
  <text x="953" y="267" font-family="Georgia,serif" font-size="25" fill="#51435e">Mini conversor</text>
  <text x="953" y="296" font-family="Arial,sans-serif" font-size="13" fill="#887b8c">Un cálculo rápido para seguir estudiando.</text>
  <rect x="953" y="315" width="348" height="39" rx="10" fill="#fff" stroke="#e4dce9"/><text x="970" y="340" font-family="Arial,sans-serif" font-size="13" fill="#766b7b">Longitud</text><path d="m1274 330 6 6 6-6" fill="none" stroke="#887b8c" stroke-width="1.5"/>
  <rect x="953" y="365" width="106" height="42" rx="10" fill="#fff" stroke="#e4dce9"/><text x="970" y="391" font-family="Arial,sans-serif" font-size="13" fill="#776a7c">12</text>
  <rect x="1068" y="365" width="103" height="42" rx="10" fill="#fff" stroke="#e4dce9"/><text x="1083" y="391" font-family="Arial,sans-serif" font-size="13" fill="#776a7c">km</text><path d="m1145 382 5 5 5-5" fill="none" stroke="#887b8c"/>
  <text x="1180" y="391" font-family="Georgia,serif" font-size="22" fill="#ac8ab8">→</text>
  <rect x="1200" y="365" width="101" height="42" rx="10" fill="#fff" stroke="#e4dce9"/><text x="1216" y="391" font-family="Arial,sans-serif" font-size="13" fill="#776a7c">m</text><path d="m1274 382 5 5 5-5" fill="none" stroke="#887b8c"/>
  <rect x="953" y="420" width="348" height="43" rx="12" fill="#fff"/><text x="970" y="447" font-family="Arial,sans-serif" font-size="14" fill="#66566f">12 km = 12.000 m</text><text x="1280" y="447" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#b47792">Guardar como nota ↗</text>
  <!-- board -->
  <text x="116" y="550" font-family="Georgia,serif" font-size="28" fill="#51435e">El tablero</text>
  <text x="116" y="578" font-family="Arial,sans-serif" font-size="13" fill="#887b8c">Tus apuntes, a mano y en orden.</text>
  <rect x="1037" y="526" width="275" height="42" rx="12" fill="#fff" stroke="#e8dfe9"/><text x="1055" y="552" font-family="Arial,sans-serif" font-size="13" fill="#766b7b">Todas las categorías</text><path d="m1281 543 6 6 6-6" fill="none" stroke="#887b8c"/>
  <!-- cards -->
  <g filter="url(#shadow)"><rect x="116" y="606" width="278" height="246" rx="8" fill="#fbf0c9" transform="rotate(-1 255 729)"/><rect x="415" y="606" width="278" height="246" rx="8" fill="#f8dfeb" transform="rotate(.8 554 729)"/><rect x="714" y="606" width="278" height="246" rx="8" fill="#e6def5" transform="rotate(-.6 853 729)"/><rect x="1013" y="606" width="278" height="246" rx="8" fill="#f8e0d4" transform="rotate(1 1152 729)"/></g>
  <g font-family="Arial,sans-serif"><text x="139" y="645" font-size="11" letter-spacing="1.3" fill="#a27748">IDEAS</text><text x="139" y="684" font-family="Georgia,serif" font-size="19" fill="#51435e">Repasar fracciones</text><text x="139" y="714" font-size="14" fill="#716576">Buscar ejemplos con</text><text x="139" y="735" font-size="14" fill="#716576">denominadores distintos.</text><text x="139" y="816" font-size="11" fill="#9c8b70">hoy · 10:24</text>
  <text x="438" y="645" font-size="11" letter-spacing="1.3" fill="#a45f7c">PENDIENTES</text><text x="438" y="684" font-family="Georgia,serif" font-size="19" fill="#51435e">Leer el capítulo 3</text><text x="438" y="714" font-size="14" fill="#716576">Anotar las ideas clave</text><text x="438" y="735" font-size="14" fill="#716576">para el club del jueves.</text><text x="438" y="816" font-size="11" fill="#a0808e">ayer · 18:12</text>
  <text x="737" y="645" font-size="11" letter-spacing="1.3" fill="#786492">CÁLCULOS</text><text x="737" y="684" font-family="Georgia,serif" font-size="19" fill="#51435e">12 km = 12.000 m</text><text x="737" y="714" font-size="14" fill="#716576">Conversión guardada</text><text x="737" y="735" font-size="14" fill="#716576">desde el mini conversor.</text><text x="737" y="816" font-size="11" fill="#8c7ba2">hoy · 10:31</text>
  <text x="1036" y="645" font-size="11" letter-spacing="1.3" fill="#ad7058">PREGUNTAS</text><text x="1036" y="684" font-family="Georgia,serif" font-size="19" fill="#51435e">¿Qué es una hipótesis?</text><text x="1036" y="714" font-size="14" fill="#716576">Llevar esta duda a la</text><text x="1036" y="735" font-size="14" fill="#716576">próxima sesión.</text><text x="1036" y="816" font-size="11" fill="#a27e6d">lunes · 16:40</text></g>
  <g fill="#87798a" font-family="Arial,sans-serif" font-size="13"><text x="351" y="635">✎　×</text><text x="650" y="635">✎　×</text><text x="949" y="635">✎　×</text><text x="1248" y="635">✎　×</text></g>
  <text x="720" y="910" text-anchor="middle" font-family="Georgia,serif" font-size="15" font-style="italic" fill="#aa94ab">un espacio para pensar bonito ✿</text>
</svg>
